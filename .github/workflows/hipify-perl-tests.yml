name: hipify-perl tests
on:
  push:
  pull_request:

jobs:
  perl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.36'
      - name: Run harness
        run: perl tests/perl/harness.pl
